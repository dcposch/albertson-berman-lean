# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "albertson-berman-palomar"
  description: >-
    Lean 4 / Mathlib certificate that the Albertson–Berman conjecture is
    false: Jung’s 31-vertex maximal planar seed T is a spherical
    triangulation with 87 edges and 58 faces, Euler characteristic 2, and
    induced-forest number a(T)=15 < 16. Planarity is a finite sphere
    certificate; a(T)≤15 is Jung’s selected-edge transfer on two
    icosahedral gadgets in a pentagonal bipyramid, not a 2^31 enumeration.
    The compared statement does not claim that 29 is the minimum order of
    a counterexample.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C10", "05C69"]

sources:
  - title: "A 15/31 Counterexample Family to the Albertson–Berman Conjecture"
    authors:
      - "Heejae Jung"
    id: "arXiv:2608.17350"
    type: "article"
    location: "arXiv:2608.17350, 2026"
    relationship: "independently-proves"
    note: >-
      Formalizes Jung’s 31-vertex seed T: spherical triangulation
      certificate, 15-vertex induced tree, and selected-edge transfer
      a(T)≤a(X(B,Q))=6|Q|+β(B,Q)=15. Does not formalize the annular
      family M_k, minimum-order claims, or computational a(T) solvers.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A conjecture on planar graphs"
    authors:
      - "Michael O. Albertson"
      - "David M. Berman"
    type: "article"
    location: "Graph Theory and Related Topics (Bondy–Murty, eds.), Academic Press, 1979, p. 357"
    relationship: "background"
    note: "The 1979 conjecture that every planar graph on n vertices has an induced forest of order at least n/2."
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations: []

status:
  scope: >-
    Compared: AlbertsonBerman.counterexample, the conjunction of the
    31-vertex seed’s edge/face counts, connectedness, triangular faces,
    2-face incidence, edge-set equality, Euler characteristic 2, a
    15-vertex induced tree, and the universal bound that no 16-vertex
    induced subgraph is acyclic. Not compared: the infinite 15k/31k
    annular family, minimum counterexample order, or degree-multiset
    claims.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["grok-4.6"]
      framework: "Grok Build TUI"
      tool_setup: "AI-assisted Lean 4 with Mathlib v4.32.0; local lake verify"
      cost:
        wall_time: "one session"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Jung transfer and sphere certificate; no native_decide"
  spend_usd: "not tracked"
  notes: >-
    Coordinator scaffolded the Palomar project; this lane closed the
    remaining Solution.lean sorries. Scratch files verified with
    scripts/lean_verify.sh --file FILE --receipt-only, patterned on
    jc2-lean/max11-partial-y/scripts/box_lean_verify.sh.

fidelity:
  divergences: >-
    Challenge/Solution state the 31-vertex seed certificate rather than
    the full 15k/31k family. Upper bound a(T)≤15 uses the gadget profile
    and bipyramid score β=3, transported by injective embeddings, instead
    of enumerating 2^31 subsets. Does not formalize minimum order 29.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "Statement surface follows Jung’s seed proposition: planarity plus a(T)=15."

alignment:
  namespace: "AlbertsonBerman"
  statements:
    - source: "Jung, Proposition (The seed): T is maximal planar with a(T)=15"
      lean: "AlbertsonBerman.counterexample"
      module: "Challenge"
      status: "proved"
      note: >-
        Sphere triangulation (58 faces, two per edge, Euler 2) and
        induced-forest number 15 (witness tree plus transfer a≤15).

acknowledgements: >-
  Mathlib; Jung arXiv:2608.17350; Albertson–Berman 1979; Palomar template;
  jc2-lean box_lean/scratch/lane machinery (local receipt gate only).
